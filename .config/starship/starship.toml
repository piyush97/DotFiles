# Starship Configuration
# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = true

# Format of the prompt
format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$rust\
$golang\
$docker_context\
$kubernetes\
$aws\
$terraform\
$cmd_duration\
$line_break\
$character"""

# Directory module configuration
[directory]
style = "bold cyan"
truncation_length = 3
truncate_to_repo = true
format = "[$path]($style)[$read_only]($read_only_style) "

# Git branch configuration
[git_branch]
symbol = " "
style = "bold purple"
format = "[$symbol$branch]($style) "

# Git status configuration
[git_status]
style = "bold red"
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = "⚔️ "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "📦${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

# Character module (prompt character)
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vicmd_symbol = "[❮](bold green)"

# Command duration
[cmd_duration]
min_time = 2_000
format = "took [$duration](bold yellow) "
show_milliseconds = false

# Username module
[username]
style_user = "bold dimmed blue"
show_always = false
format = "[$user]($style) "

# Hostname module
[hostname]
ssh_only = true
format = "[@$hostname](bold dimmed green) "
disabled = false

# Node.js configuration
[nodejs]
symbol = " "
style = "bold green"
format = "[$symbol($version )]($style)"
detect_extensions = ["js", "mjs", "cjs", "ts", "mts", "cts"]
detect_files = ["package.json", ".node-version", ".nvmrc"]
detect_folders = ["node_modules"]

# Python configuration
[python]
symbol = " "
style = "bold yellow"
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
pyenv_version_name = true
detect_extensions = ["py"]
detect_files = [".python-version", "Pipfile", "requirements.txt", "setup.py", "pyproject.toml"]

# Rust configuration
[rust]
symbol = " "
style = "bold red"
format = "[$symbol($version )]($style)"

# Go configuration
[golang]
symbol = " "
style = "bold cyan"
format = "[$symbol($version )]($style)"

# Docker configuration
[docker_context]
symbol = " "
style = "bold blue"
format = "[$symbol$context]($style) "
only_with_files = true
detect_files = ["docker-compose.yml", "docker-compose.yaml", "Dockerfile"]

# Kubernetes configuration
[kubernetes]
symbol = "☸ "
style = "bold blue"
format = '[$symbol$context( \($namespace\))]($style) '
disabled = false

# AWS configuration
[aws]
symbol = " "
style = "bold orange"
format = '[$symbol($profile )(\($region\) )]($style)'
[aws.region_aliases]
us-east-1 = "use1"
us-west-2 = "usw2"

# Terraform configuration
[terraform]
symbol = "💠 "
style = "bold purple"
format = "[$symbol$workspace]($style) "

# Package version
[package]
symbol = "📦 "
style = "bold 208"
format = "[$symbol$version]($style) "
disabled = false

# Time module (optional - disabled by default)
[time]
disabled = true
format = '[$time]($style) '
time_format = "%T"
style = "bold dimmed white"

# Battery module
[battery]
full_symbol = "🔋"
charging_symbol = "⚡"
discharging_symbol = "💀"
unknown_symbol = "❓"
empty_symbol = "🪫"

[[battery.display]]
threshold = 20
style = "bold red"

[[battery.display]]
threshold = 50
style = "bold yellow"

[[battery.display]]
threshold = 80
style = "bold green"

# Memory usage
[memory_usage]
symbol = "🐏 "
disabled = true
threshold = 75
format = "$symbol[$ram_pct]($style) "
style = "bold dimmed red"

# Jobs indicator
[jobs]
symbol = "⚙"
style = "bold blue"
number_threshold = 1
format = "[$symbol$number]($style) "

# Status module
[status]
style = "bold red"
symbol = "✖"
format = '[$symbol $common_meaning$signal_name$maybe_int]($style) '
map_symbol = true
disabled = false